<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            opacity: 1;
            transition: 1s opacity;
            font-family: Arial, Helvetica, sans-serif;
        }

        body.fade-out {
            opacity: 0;
            transition: none;
        }

        * {
            box-sizing: border-box;
        }

        /* Button used to open the contact form - fixed at the bottom of the page */
        .open-button {
            background-color: #555;
            color: white;
            padding: 16px 20px;
            border: none;
            cursor: pointer;
            opacity: 0.8;
            position: fixed;
            bottom: 23px;
            right: 28px;
            width: 280px;
        }

        /* The popup form - hidden by default */
        .form-popup {
            display: none;
            position: fixed;
            bottom: 0;
            right: 15px;
            border: 3px solid #f1f1f1;
            z-index: 9;
        }

        /* Add styles to the form container */
        .form-container {
            max-width: 300px;
            padding: 10px;
            background-color: white;
        }

        /* Full-width input fields */
        .form-container input[type=text],
        .form-container input[type=password] {
            width: 100%;
            padding: 15px;
            margin: 5px 0 22px 0;
            border: none;
            background: #f1f1f1;
        }

        /* When the inputs get focus, do something */
        .form-container input[type=text]:focus,
        .form-container input[type=password]:focus {
            background-color: #ddd;
            outline: none;
        }

        /* Set a style for the submit/login button */
        .form-container .btn {
            background-color: #04AA6D;
            color: white;
            padding: 16px 20px;
            border: none;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        /* Add a red background color to the cancel button */
        .form-container .cancel {
            background-color: red;
        }

        /* Add some hover effects to buttons */
        .form-container .btn:hover,
        .open-button:hover {
            opacity: 1;
        }

        #moveCube {
            width: 100px;
            height: 100px;
            background: green;
            position: relative;
            animation: mymove 10s infinite;
        }

        @keyframes mymove {
            from {
                top: 0px;
            }

            to {
                top: 200px;
            }
        }

        @keyframes zoominoutsinglefeatured {
            0% {
                transform: scale(1, 1);
            }

            50% {
                transform: scale(1.2, 1.2);
            }

            100% {
                transform: scale(1, 1);
            }
        }

        .single-featured-image-header {
            animation: zoominoutsinglefeatured 15s forwards;
        }


        /* Add a black background color to the top navigation */
        .topnav {
            margin-bottom: 18px;
            background-color: #10375c;
            overflow: hidden;
            font-weight: bold;
            font-size: larger;
        }

        /* Style the links inside the navigation bar */
        .topnav a {
            float: left;
            color: #f1f1e6;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        /* Change the color of links on hover */
        .topnav a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Add a color to the active/current link */
        .topnav a.active {
            background-color: #dca11d;
            color: white;
        }

        /* slide show styling*/
        #slideshow {
            margin: 50px auto;
            position: relative;
            width: 240px;
            height: 240px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            background-color: black;
        }

        #slideshow>div {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            text-align: center;
        }

        div.sticky {
            position: sticky;
            top: 0;
            background-color: yellow;
            padding: 50px;
            font-size: 20px;
        }
    </style>
</head>


<body>

    <!--NavBar-->
    <div>
        <section>
            <div class="topnav">
                <a class="action" href="#">Home</a>
                <a href="#zoom">Zoom</a>
                <a href="#fontSizing">Font Sizing</a>
                <a href="#XML">XML</a>
                <a href="#JSForm">Javascript Form</a>
                <a href="#slideshow">Slideshow</a>
                <a href="#animation">Animation</a>
            </div>
        </section>
    </div>

    <!--Zoom in and Zoom Out-->
    <div id="zoom" class="single-featured-image-header" style="overflow:hidden;">
        <img style="width: 150px; height: auto;"
            src="https://kesslerandsons.com/wp-content/uploads/2015/04/yanagisawa-awo33-alto-sax.jpg">
    </div>


    <!--fade in and fade out function-->
    <script>
        document.body.classList.add('fade-out');
    </script>

    <!--dynamic font with vw-->
    <div id="fontSizing">
        <h1 style="font-size:8vw;">New Title</h1>
        <p style="font-size:2vw;">Dynamic Font Sizing is Coooooooooooooooooooool</p>
    </div>



    <script>
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.remove('fade-out');
        });
    </script>


    <!--xml-->
    <div id="XML">
        <p id="XML_Example"></p>
    </div>

    <script>
        // define XML structure as a string
        let characterData = "<character>" +
            "<name>Link</name>" +
            "<game>The Legend of Zelda</game>" +
            "<weapon>Master Sword</weapon>" +
            "<year>1986</year>" +
            "</character>";

        // create the Parser
        let XML_Parser = new DOMParser();
        let XML_Document = XML_Parser.parseFromString(characterData, "text/xml");

        // Get the data and display it
        let name = XML_Document.getElementsByTagName("name")[0].childNodes[0].nodeValue;
        let weapon = XML_Document.getElementsByTagName("weapon")[0].childNodes[0].nodeValue;

        document.getElementById("XML_Example").innerHTML = name + "'s weapon is the " + weapon;
    </script>

    <!--form with JS-->
    <div id="JSForm">
        <h3>Form Fields</h3>

        <form name="contactForm" action="/action_page.php" onsubmit="return validateForm()" method="post">
            <p>
                Name: <input type="text" name="fname">
            </p>
            <p>
                Phone Number: <input type="tel" name="telephoneNumber">
            </p>

            <input type="submit" value="Submit">
        </form>
    </div>
    <script>
        function validateForm() {
            // Check Name
            let x = document.forms["contactForm"]["fname"].value;
            if (x == "") {
                alert("Name must be filled out");
                return false;
            }

            // Check Phone Number
            let y = document.forms["contactForm"]["telephoneNumber"].value;
            if (y == "") {
                alert("Phone Number must be filled out");
                return false;
            }

            // If it reaches here, everything is valid
            alert("Form Submitted Successfully");
            return true;
        }
    </script>


    <!--Popup Contact-->


    <h3>Popup Form</h3>
    <p>Click button to open login form.</p>

    <button class="open-button" onclick="openForm()">Open Form</button>

    <div class="form-popup" id="popupForm" style="display:none;">
        <form action="/action_page.php" class="form-container">
            <h2>Contact Us</h2>

            <label for="name"><b>Name</b></label>
            <input type="text" placeholder="Your Name" name="name" required>

            <label for="email"><b>Email</b></label>
            <input type="text" placeholder="Enter Email" name="email" required>

            <label for="msg"><b>Message</b></label>
            <textarea placeholder="Type your message here..." name="msg" required
                style="width: 100%; height: 100px;"></textarea>

            <button type="submit" class="btn">Send Message</button>
            <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
        </form>
    </div>

    <script>
        function openForm() {
            document.getElementById("popupForm").style.display = "block";
        }

        function closeForm() {
            document.getElementById("popupForm").style.display = "none";
        }
    </script>

    <!--slideshow animation-->
    <div id="slideshow">
        <div>
            <img style="width: auto; height: 240px;" src="https://www.yanagisawasax.co.jp/media/5/4/54_1000x1626.png">
        </div>
        <div>
            <img style="width: auto; height: 240px;" src="https://www.yanagisawasax.co.jp/media/5/7/57_1000x1626.png">
        </div>
        <div>
            <img style="width: auto; height: 240px;" src="https://www.yanagisawasax.co.jp/media/6/1/61_1000x1626.png">
        </div>
    </div>

    <script>
        $("#slideshow > div:gt(0)").hide();

        setInterval(function () {
            $('#slideshow > div:first')
                .fadeOut(1000)
                .next()
                .fadeIn(1000)
                .end()
                .appendTo('#slideshow');
        }, 3000);
    </script>


    <!--keyframe animation-->
    <div id="animation">
        <h2>The @keyframes Animation</h2>
        <div id="moveCube"></div>
    </div>



</body>

</html>
