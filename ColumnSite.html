<!DOCTYPE html>
<html lang="en">

<head>
    <title>Column HTML</title>
    <meta charset="UTF-8">
    <meta name="author" content="Kyle Gaffney">
        <link rel="stylesheet" href="ColumnStyles.css">

</head>

<body>
    <header>
        <h4 id="heading">Column Table HTML</h4>
    </header>

    <table>
        <caption>
            Villains and Sidekicks
        </caption>
        <colgroup>
            <col />
            <col span="2" class="joker" />
            <col span="2" class="ivy" />
        </colgroup>
        <thead>
            <tr>
                <td></td>
                <th scope="col">The Joker</th>
                <th scope="col">Harley Quinn</th>
                <th scope="col">Poison Ivy</th>
                <th scope="col">Bane</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Skill</th>
                <td>Smarts, mean</td>
                <td>Dexterity, acrobat</td>
                <td>Controls Plants</td>
                <td>Super Strength</td>
            </tr>
        </tbody>
    </table>

    <br>
    <footer>Made by Kyle Gaffney</footer>

</body>

</html>
