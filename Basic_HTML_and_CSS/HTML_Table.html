<!DOCTYPE html>
<html lang="en">
    <head>
        <title>HTML Table</title>
        <meta charset="UTF-8">
        <meta name="author" content="Kyle Gaffney">
        <link rel="stylesheet" type="text/css" href="css_table.css">
    </head>

    <body>
        <h1>Saxohone Table</h1>
        <table style="width:100%">
            <tr>
                <th>Type</th>
                <th>Key</th>
                <th>Notes</th>
            </tr>
            <tr>
                <td>Soporano</td>
                <td>Bb</td>
                <td>Significantly more difficult to play than the others</td>
            </tr>
            <tr>
                <td>Alto</td>
                <td>Eb</td>
                <td>The most common starting type for new players</td>
            </tr>
            <tr>
                <td>Tenor</td>
                <td>Bb</td>
                <td>The most common saxohone used in jazz</td>
            </tr>
            <tr>
                <td>Baritone</td>
                <td>Eb</td>
                <td>The least common saxophone, and very expensive to own</td>
            </tr>

        </table>
        
    </body>
</html>
