<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Contact Us</title>
        <meta charset="UTF-8">
        <meta name="author" content="Kyle Gaffney">
    </head>
    <body>
        <!--nav bar-->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <!--header-->
        <header>
            <div>
                <h1>Contact Us</h1>
            </div>
        </header>
        <!--form-->
        <section>
            <div>
                <h3>Please provide your contact information
                    and include a brief message.
                </h3>
                <div>
                    <form>
                        <input type="text" placeholder="First Name">
                        <input type="text" placeholder="Last Name">
                        <br>
                        <input type="email" placeholder="Email">
                        <br>
                        <input type="tel" placeholder="Phone Number">
                        <br>
                        <input type="checkbox" id="Newsletter">
                        <label for="Newsletter">Receive The Pet Shop monthly Newsletter?</label>
                        <textarea placeholder="Type message here"></textarea>
                        <br>
                        <input type="submit" value="Submit">
                    </form>
                </div>
            </div>
        </section>
        <!--footer-->
        <footer>
            <table>
                <tr>
                    <td>
                        <p>The Pet Shop &copy;</p>
                    </td>
                    <td>
                        <p>123 Square Ave</p>
                        <p>Portland, Oregon 97204</p>
                    </td>
                    <td>
                        <p>(503) 234-3966</p>
                    </td>
                </tr>
            </table>
        </footer>
    </body>
</html>
